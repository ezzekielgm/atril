<!DOCTYPE html>
<html lang="es" data-theme="claro" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atril – lector de discursos</title>
<meta name="description" content="Lee tus discursos de Word en el iPad con letra grande, cronómetro y sin conexión. Gratis; todo se queda en tu dispositivo.">
<!-- Vista previa al mandar el enlace (WhatsApp, correo…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atril">
<meta property="og:title" content="Atril, lector de discursos">
<meta property="og:description" content="Lee tus discursos de Word en el iPad con letra grande, cronómetro y sin conexión. Gratis; todo se queda en tu dispositivo.">
<meta property="og:image" content="https://ezzekielgm.github.io/atril/icons/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#185abd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atril">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Inicio -->
<section id="view-home" class="view" hidden>
  <header class="home-hero">
    <div class="hero-txt">
      <h1 class="brand">Atril</h1>
      <p class="brand-sub">Lector de discursos</p>
    </div>
  </header>
  <div class="home-tools home-wrap">
    <div class="tabs-row">
      <div class="segmented" role="tablist">
        <button role="tab" data-tab="docs">Discursos</button>
        <button role="tab" data-tab="notes">Notas</button>
      </div>
      <button class="tool tool-ajustes" id="btn-settings"><span data-icon="settings"></span><span class="lbl">Ajustes</span></button>
    </div>
    <label class="search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Buscar por título, texto o lugar" autocomplete="off">
    </label>
  </div>
  <div class="scroll" id="home-scroll"><div class="home-wrap">
    <div class="install-hint" id="install-hint" hidden>
      <p><strong>Instálala en el iPad:</strong> toca <span data-icon="share" class="inline-icon"></span> Compartir y luego <em>Añadir a pantalla de inicio</em>. Así se abre como una app y funciona sin internet.</p>
      <button class="text-btn" id="hide-install-hint">Entendido</button>
    </div>
    <div class="install-hint backup-hint" id="backup-hint" role="status" hidden>
      <p id="backup-hint-text"></p>
      <div class="backup-btns">
        <button class="btn primary" id="backup-now"><span>Hacer copia</span></button>
        <button class="text-btn" id="backup-later">Más tarde</button>
      </div>
    </div>
    <div class="home-actions" id="home-actions"></div>
    <div class="seguir" id="seguir" hidden></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </div></div>
  <input type="file" id="file-input" accept=".docx,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" multiple hidden>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>
</section>

<!-- Lector -->
<section id="view-reader" class="view" hidden>
  <header class="topbar reader-bar">
    <button class="back-btn" id="reader-back" aria-label="Volver a tus discursos"><span data-icon="back"></span><span class="lbl">Discursos</span></button>
    <div class="title" id="reader-title"></div>
    <div class="timer" id="timer">
      <button class="timer-btn" id="timer-toggle" aria-label="Cronómetro"><span data-icon="timer"></span><span id="timer-text">00:00</span></button>
      <button class="icon-btn small" id="timer-reset" aria-label="Poner a cero" data-icon="reset" hidden></button>
    </div>
    <span class="pace" id="pace" role="status" hidden></span>
    <nav class="reader-tools" aria-label="Herramientas del discurso">
      <button class="tool" id="reader-outline-btn" aria-pressed="false"><span data-icon="outline"></span><span class="lbl">Esquema</span></button>
      <button class="tool" id="reader-aa"><span data-icon="aa"></span><span class="lbl">Letra</span></button>
      <button class="tool tool-presentar" id="reader-presentar"><span data-icon="play"></span><span class="lbl">Presentar</span></button>
      <button class="tool" id="reader-edit"><span data-icon="edit"></span><span class="lbl">Editar</span></button>
      <button class="tool" id="reader-more"><span data-icon="more"></span><span class="lbl">Más</span></button>
    </nav>
  </header>
  <div class="pres-bar" id="pres-bar" hidden>
    <button class="pres-timer" id="pres-timer" aria-label="Cronómetro"><span class="pres-t" id="pres-timer-text">00:00</span><span class="pres-hint" id="pres-hint">Toca para empezar</span></button>
    <div class="pres-info">
      <div class="pres-fila">
        <span class="pace" id="pres-pace" role="status" hidden></span>
        <span class="pres-quedan" id="pres-quedan" hidden></span>
        <span class="pres-reloj" id="pres-reloj" aria-label="Hora"></span>
      </div>
      <div class="pres-parte" id="pres-parte"></div>
      <div class="pres-sigue" id="pres-sigue"></div>
    </div>
    <div class="pres-prog" id="pres-prog" aria-hidden="true"></div>
  </div>
  <div class="findbar" id="findbar" hidden>
    <label class="search">
      <span data-icon="search"></span>
      <input id="find-input" type="search" placeholder="Buscar en el texto" autocomplete="off" enterkeyhint="search">
    </label>
    <span class="find-count" id="find-count" role="status"></span>
    <button class="icon-btn" id="find-prev" aria-label="Anterior" data-icon="up"></button>
    <button class="icon-btn" id="find-next" aria-label="Siguiente" data-icon="down"></button>
    <button class="icon-btn" id="find-close" aria-label="Cerrar la búsqueda" data-icon="close"></button>
  </div>
  <div class="progress"><div id="progress-bar"></div></div>
  <div class="split-body">
    <aside class="side-pane" id="reader-side" aria-label="Esquema" hidden>
      <div class="side-head"><span>Esquema</span><button class="icon-btn small" id="reader-side-close" aria-label="Cerrar el esquema" data-icon="close"></button></div>
      <div class="side-list outline" id="reader-side-list"></div>
    </aside>
    <div class="scroll reader-scroll" id="reader-scroll">
      <article class="doc-content" id="reader-content"></article>
      <div class="doc-content outline" id="reader-outline" hidden></div>
    </div>
  </div>
  <footer class="statusbar reader-estado" id="reader-estado">
    <span class="re-parte" id="re-parte"></span>
    <span class="spacer"></span>
    <span class="re-quedan" id="re-quedan"></span>
  </footer>
  <button class="float-timer" id="float-timer" aria-label="Cronómetro" hidden></button>
  <button class="pres-salir" id="pres-salir" hidden><span data-icon="lock"></span><span>Mantén pulsado para salir</span><i class="pres-carga"></i></button>
  <div class="tp-guide" id="tp-guide" aria-hidden="true" hidden></div>
  <div class="tp-bar" id="tp-bar" role="toolbar" aria-label="Desplazamiento automático" hidden>
    <button class="icon-btn" id="tp-play" aria-label="Pausa"></button>
    <button class="icon-btn tp-step" id="tp-slower" aria-label="Más despacio">−</button>
    <span class="tp-speed" id="tp-speed"></span>
    <button class="icon-btn tp-step" id="tp-faster" aria-label="Más deprisa">+</button>
    <button class="icon-btn" id="tp-close" aria-label="Terminar" data-icon="close"></button>
  </div>
  <div class="cards" id="cards" hidden>
    <header class="topbar cards-bar">
      <button class="icon-btn" id="cards-close" aria-label="Salir de las tarjetas" data-icon="close"></button>
      <div class="title" id="cards-title"></div>
      <div class="timer" id="cards-timer">
        <button class="timer-btn" id="cards-timer-toggle" aria-label="Cronómetro"><span data-icon="timer"></span><span id="cards-timer-text">00:00</span></button>
      </div>
      <span class="pace" id="cards-pace" role="status" hidden></span>
    </header>
    <div class="cards-prog" id="cards-prog" aria-hidden="true"></div>
    <div class="cards-stage" id="cards-stage">
      <article class="doc-content card-body" id="card-body"></article>
    </div>
    <footer class="cards-nav">
      <button class="icon-btn" id="cards-prev" aria-label="Tarjeta anterior" data-icon="prev"></button>
      <span class="cards-count" id="cards-count"></span>
      <button class="icon-btn" id="cards-next" aria-label="Tarjeta siguiente" data-icon="next"></button>
    </footer>
  </div>
</section>

<!-- Editor -->
<section id="view-editor" class="view" hidden>
  <header class="topbar word-bar">
    <button class="icon-btn" id="editor-back" aria-label="Volver" data-icon="back"></button>
    <input class="title-input" id="editor-title" placeholder="Título" autocomplete="off">
    <span class="save-state" id="save-state"></span>
    <button class="icon-btn" id="editor-read" aria-label="Modo lectura" data-icon="book"></button>
    <button class="icon-btn" id="editor-more" aria-label="Archivo: guardar, compartir…" data-icon="more"></button>
  </header>
  <div class="ribbon-tabs" role="tablist" aria-label="Cinta de opciones">
    <button role="tab" data-rtab="inicio" aria-selected="true">Inicio</button>
    <button role="tab" data-rtab="insertar" aria-selected="false">Insertar</button>
    <button role="tab" data-rtab="revisar" aria-selected="false">Revisar</button>
    <button role="tab" data-rtab="vista" aria-selected="false">Vista</button>
  </div>
  <div class="toolbar ribbon" id="toolbar" data-rpanel="inicio">
    <button data-cmd="undo" aria-label="Deshacer" data-icon="undo"></button>
    <button data-cmd="redo" aria-label="Rehacer" data-icon="redo"></button>
    <span class="sep"></span>
    <div class="estilos" role="group" aria-label="Estilos">
      <button data-cmd="p" class="estilo e-p" aria-label="Estilo Normal"><span class="muestra">AaBbCc</span><span class="nom">Normal</span></button>
      <button data-cmd="h1" class="estilo e-h1" aria-label="Estilo Título 1"><span class="muestra">AaBbCc</span><span class="nom">Título 1</span></button>
      <button data-cmd="h2" class="estilo e-h2" aria-label="Estilo Título 2"><span class="muestra">AaBbCc</span><span class="nom">Título 2</span></button>
      <button data-cmd="h3" class="estilo e-h3" aria-label="Estilo Título 3"><span class="muestra">AaBbCc</span><span class="nom">Título 3</span></button>
    </div>
    <span class="sep"></span>
    <button data-cmd="bold" aria-label="Negrita"><b>N</b></button>
    <button data-cmd="italic" aria-label="Cursiva"><i>K</i></button>
    <button data-cmd="underline" aria-label="Subrayado"><u>S</u></button>
    <button data-cmd="strike" aria-label="Tachado" class="txt"><s>abc</s></button>
    <button data-cmd="highlight" aria-label="Resaltar" aria-expanded="false" data-icon="marker"></button>
    <button data-cmd="letra" aria-label="Color de letra" aria-expanded="false" class="btn-letra"><span class="a-letra">A</span><i class="barra-letra" id="barra-letra"></i></button>
    <span class="sep"></span>
    <button data-cmd="ul" aria-label="Viñetas" data-icon="list"></button>
    <button data-cmd="ol" aria-label="Lista numerada" data-icon="olist"></button>
    <button data-cmd="clear" aria-label="Borrar formato" data-icon="clear"></button>
    <span class="sep solo-ancho"></span>
    <button data-cmd="buscar" class="solo-ancho" aria-label="Buscar y reemplazar" data-icon="search"></button>
  </div>
  <div class="toolbar ribbon" data-rpanel="insertar" hidden>
    <button data-cmd="parte" class="grande"><span data-icon="plus"></span><span>Parte nueva</span></button>
    <button data-cmd="minutos" class="grande"><span data-icon="clock"></span><span>Minutos de la parte</span></button>
    <span class="sep"></span>
    <button data-cmd="pausa" class="grande"><span class="ico-pausa">‖</span><span>Pausa</span></button>
  </div>
  <div class="toolbar ribbon" data-rpanel="revisar" hidden>
    <button data-cmd="buscar" class="grande"><span data-icon="search"></span><span>Buscar y reemplazar</span></button>
    <button data-cmd="tiempo" class="grande"><span data-icon="clock"></span><span>Palabras y tiempo</span></button>
    <button data-cmd="versiones" class="grande"><span data-icon="history"></span><span>Versiones anteriores</span></button>
  </div>
  <div class="toolbar ribbon" data-rpanel="vista" hidden>
    <button data-cmd="leer" class="grande"><span data-icon="book"></span><span>Modo lectura</span></button>
    <button data-cmd="navegacion" class="grande" aria-pressed="false"><span data-icon="panel"></span><span>Panel de navegación</span></button>
    <span class="sep"></span>
    <button data-cmd="menos" class="txt" aria-label="Letra más pequeña">A−</button>
    <button data-cmd="mas" class="txt" aria-label="Letra más grande">A+</button>
    <span class="sep"></span>
    <button data-cmd="aspecto" class="grande"><span data-icon="aa"></span><span>Letra y tema</span></button>
  </div>
  <div class="palette" id="palette" role="toolbar" aria-label="Colores del resaltador" hidden>
    <span class="palette-label">Resaltar</span>
    <button data-color="amarillo" class="sw sw-amarillo" aria-label="Amarillo"></button>
    <button data-color="verde" class="sw sw-verde" aria-label="Verde"></button>
    <button data-color="azul" class="sw sw-azul" aria-label="Azul"></button>
    <button data-color="rosa" class="sw sw-rosa" aria-label="Rosa"></button>
    <button data-color="quitar" class="txt">Quitar</button>
    <span class="spacer"></span>
    <button data-color="cerrar" aria-label="Cerrar los colores" data-icon="close"></button>
  </div>
  <div class="palette" id="palette-letra" role="toolbar" aria-label="Color de la letra" hidden>
    <span class="palette-label">Color de letra</span>
    <button data-letra="rojo" class="sw-letra l-rojo" aria-label="Rojo">A</button>
    <button data-letra="azul" class="sw-letra l-azul" aria-label="Azul">A</button>
    <button data-letra="verde" class="sw-letra l-verde" aria-label="Verde">A</button>
    <button data-letra="naranja" class="sw-letra l-naranja" aria-label="Naranja">A</button>
    <button data-letra="quitar" class="txt">Automático</button>
    <span class="spacer"></span>
    <button data-letra="cerrar" aria-label="Cerrar los colores" data-icon="close"></button>
  </div>
  <div class="replacebar" id="replacebar" role="search" hidden>
    <label class="search"><span data-icon="search"></span><input id="rep-buscar" type="search" placeholder="Buscar" autocomplete="off" enterkeyhint="search"></label>
    <span class="find-count" id="rep-count" role="status"></span>
    <button class="icon-btn" id="rep-prev" aria-label="Anterior" data-icon="up"></button>
    <button class="icon-btn" id="rep-next" aria-label="Siguiente" data-icon="down"></button>
    <button class="icon-btn" id="rep-close" aria-label="Cerrar" data-icon="close"></button>
    <label class="search rep-por"><span data-icon="replace"></span><input id="rep-por" type="text" placeholder="Reemplazar por" autocomplete="off"></label>
    <button class="btn" id="rep-uno">Reemplazar</button>
    <button class="btn" id="rep-todo">Reemplazar todo</button>
  </div>
  <div class="split-body">
    <aside class="side-pane" id="editor-side" aria-label="Navegación" hidden>
      <div class="side-head"><span>Navegación</span><button class="icon-btn small" id="editor-side-close" aria-label="Cerrar el panel de navegación" data-icon="close"></button></div>
      <div class="side-list outline" id="editor-side-list"></div>
    </aside>
    <div class="scroll editor-scroll" id="editor-scroll">
      <div class="doc-content editor" id="editor" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div>
    </div>
  </div>
  <footer class="statusbar">
    <span id="ed-palabras"></span>
    <button class="time-chip" id="editor-time" aria-label="Tiempo estimado" hidden></button>
    <span class="spacer"></span>
    <button class="zoom-btn" id="ed-menos" aria-label="Letra más pequeña">−</button>
    <span class="zoom-val" id="ed-zoom"></span>
    <button class="zoom-btn" id="ed-mas" aria-label="Letra más grande">+</button>
  </footer>
</section>

<div class="zoom-toast" id="zoom-toast" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
